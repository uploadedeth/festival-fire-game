<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication Test - Festival Fire Fighter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #2c3e50, #3498db);
            color: white;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #ecf0f1;
        }
        
        .controls {
            background: #2c3e50;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .auth-section {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .status {
            padding: 10px 15px;
            border-radius: 5px;
            font-weight: bold;
        }
        
        .authenticated {
            background: #2ecc71;
        }
        
        .not-authenticated {
            background: #e74c3c;
        }
        
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
        }
        
        button.primary {
            background: #3498db;
            color: white;
        }
        
        button.success {
            background: #2ecc71;
            color: white;
        }
        
        button.warning {
            background: #f39c12;
            color: white;
        }
        
        button.danger {
            background: #e74c3c;
            color: white;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        
        .iframe-container {
            background: #34495e;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        .iframe-wrapper {
            position: relative;
            width: 100%;
            height: 700px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 8px;
        }
        
        .message-log {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            max-height: 200px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
        }
        
        .message {
            margin: 5px 0;
            padding: 5px;
            border-radius: 3px;
        }
        
        .message.sent {
            background: rgba(52, 152, 219, 0.2);
            border-left: 3px solid #3498db;
        }
        
        .message.received {
            background: rgba(46, 204, 113, 0.2);
            border-left: 3px solid #2ecc71;
        }
        
        .user-form {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-left: 20px;
        }
        
        .user-form input {
            padding: 8px 12px;
            border: 1px solid #555;
            border-radius: 4px;
            background: #2c3e50;
            color: white;
        }
        
        .user-form input::placeholder {
            color: #95a5a6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Festival Fire Fighter - Authentication Test</h1>
        
        <div class="controls">
            <div class="auth-section">
                <div id="auth-status" class="status not-authenticated">Not Authenticated</div>
                
                <div class="user-form">
                    <input type="text" id="username" placeholder="Username" value="TestUser">
                    <input type="text" id="userId" placeholder="User ID" value="user_123">
                </div>
                
                <button class="success" onclick="authenticateUser()">🔐 Authenticate</button>
                <button class="danger" onclick="logoutUser()">🔓 Logout</button>
            </div>
            
            <div class="auth-section">
                <button class="primary" onclick="pauseGame()">⏸️ Pause</button>
                <button class="primary" onclick="resumeGame()">▶️ Resume</button>
                <button class="primary" onclick="restartGame()">🔄 Restart</button>
                <button class="warning" onclick="getGameState()">📊 Get State</button>
            </div>
        </div>
        
        <div class="iframe-container">
            <div class="iframe-wrapper">
                <iframe id="game-iframe" src="./index.html" title="Festival Fire Fighter"></iframe>
            </div>
        </div>
        
        <div class="message-log" id="message-log">
            <strong>📨 Message Log:</strong>
        </div>
    </div>

    <script>
        let isAuthenticated = false;
        let currentUser = null;
        const gameIframe = document.getElementById('game-iframe');
        const messageLog = document.getElementById('message-log');
        const authStatus = document.getElementById('auth-status');

        // Listen for messages from the game
        window.addEventListener('message', (event) => {
            // Security check (in real app, verify origin)
            if (event.data.source === 'festival-fire-fighter') {
                handleGameMessage(event.data);
            }
        });

        function handleGameMessage(message) {
            logMessage('received', `${message.type}`, message.data);

            switch (message.type) {
                case 'GAME_READY':
                    console.log('🎮 Game is ready!');
                    // Automatically authenticate if we have user data
                    if (currentUser) {
                        setTimeout(() => authenticateUser(), 1000);
                    }
                    break;
                    
                case 'AUTH_SUCCESS':
                    console.log('✅ Authentication successful!');
                    updateAuthStatus(true, message.data.username);
                    break;
                    
                case 'AUTH_ERROR':
                    console.error('❌ Authentication failed:', message.data.error);
                    alert('Authentication failed: ' + message.data.error);
                    break;
                    
                case 'USER_LOGGED_OUT':
                    console.log('🔓 User logged out');
                    updateAuthStatus(false);
                    break;
                    
                case 'SAVE_GAME_SCORE':
                    console.log('💾 Game wants to save score:', message.data);
                    // Simulate score saving
                    setTimeout(() => {
                        sendToGame('SCORE_SAVED', {
                            success: true,
                            scoreId: 'score_' + Date.now(),
                            ranking: Math.floor(Math.random() * 100) + 1
                        });
                    }, 1000);
                    break;
                    
                case 'REQUEST_USER_DATA':
                    console.log('📊 Game requesting user data');
                    // Simulate user data response
                    setTimeout(() => {
                        sendToGame('USER_DATA_RESPONSE', {
                            settings: {
                                audioEnabled: true,
                                difficulty: 'normal'
                            },
                            highScores: [
                                { score: 850, date: '2024-01-15' },
                                { score: 720, date: '2024-01-10' }
                            ],
                            achievements: ['first_win', 'fire_master']
                        });
                    }, 500);
                    break;
                    
                case 'GAME_STARTED':
                    console.log('🚀 Game started by user:', message.data.userId);
                    break;
                    
                case 'GAME_ENDED':
                    console.log('🏁 Game ended:', message.data);
                    break;
                    
                case 'SESSION_EXPIRED':
                    console.log('⏰ Session expired');
                    alert('Your session has expired. Please log in again.');
                    updateAuthStatus(false);
                    break;
            }
        }

        function sendToGame(type, data = {}) {
            const message = {
                type: type,
                data: data,
                source: 'nextjs-parent'
            };
            
            gameIframe.contentWindow.postMessage(message, '*');
            logMessage('sent', type, data);
        }

        function authenticateUser() {
            const username = document.getElementById('username').value || 'TestUser';
            const userId = document.getElementById('userId').value || 'user_123';
            
            currentUser = {
                userId: userId,
                username: username,
                email: username + '@test.com',
                sessionId: generateSessionId()
            };

            sendToGame('SET_USER_AUTH', currentUser);
        }

        function logoutUser() {
            sendToGame('LOGOUT_USER');
            currentUser = null;
        }

        function pauseGame() {
            sendToGame('PAUSE_GAME');
        }

        function resumeGame() {
            sendToGame('RESUME_GAME');
        }

        function restartGame() {
            sendToGame('RESTART_GAME');
        }

        function getGameState() {
            sendToGame('GET_GAME_STATE');
        }

        function generateSessionId() {
            return 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }

        function updateAuthStatus(authenticated, username = null) {
            isAuthenticated = authenticated;
            
            if (authenticated) {
                authStatus.textContent = `✅ Authenticated as ${username}`;
                authStatus.className = 'status authenticated';
            } else {
                authStatus.textContent = '❌ Not Authenticated';
                authStatus.className = 'status not-authenticated';
            }
        }

        function logMessage(direction, type, data) {
            const message = document.createElement('div');
            message.className = `message ${direction}`;
            
            const timestamp = new Date().toLocaleTimeString();
            const dataStr = data ? JSON.stringify(data, null, 2) : '';
            
            message.innerHTML = `
                <strong>[${timestamp}] ${direction.toUpperCase()}: ${type}</strong>
                ${dataStr ? `<br><pre>${dataStr}</pre>` : ''}
            `;
            
            messageLog.appendChild(message);
            messageLog.scrollTop = messageLog.scrollHeight;
        }

        // Initialize
        console.log('🔧 Authentication test page loaded');
        console.log('Click "Authenticate" to test the auth flow');
    </script>
</body>
</html>
